server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # nginx quirk: an add_header inside a location REPLACES every add_header inherited from the server block.
  # So the security headers live in one snippet that each location includes explicitly.

  # Hashed build files never change, so browsers may keep them for a year.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html must always be re-checked so a new deployment is picked up; unknown paths fall back to the app.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
