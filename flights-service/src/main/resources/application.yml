server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: flights-service
  profiles:
    default: dev          # dev also loads sample flights (see application-dev.yml)
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:flights_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:airline}
    password: ${DB_PASSWORD:airline}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none      # schema is owned by Flyway (src/main/resources/db/migration)
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Service discovery: registers as FLIGHTS-SERVICE so the gateway and booking-service (Feign) can find it by name.
# Set EUREKA_ENABLED=false to run this service completely on its own.
eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
