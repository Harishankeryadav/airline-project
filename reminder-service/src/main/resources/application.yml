server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: reminder-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:reminder_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:airline}
    password: ${DB_PASSWORD:airline}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none      # schema is owned by Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # A message that keeps failing is retried 3 times, then republished to the dead-letter queue
        # (reminder.dead-letter) instead of being redelivered forever or silently lost.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2s
          multiplier: 2
          max-interval: 10s
  mail:
    # Local default: Mailpit from docker-compose (SMTP 1025, UI http://localhost:8025).
    # Gmail: MAIL_HOST=smtp.gmail.com MAIL_PORT=587 MAIL_USERNAME=you@gmail.com MAIL_PASSWORD=<app password>
    #        MAIL_SMTP_AUTH=true MAIL_STARTTLS=true
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

app:
  jwt:
    # CONTRACT: must be the same secret auth-service signs with. Dev default only - set JWT_SECRET elsewhere.
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    issuer: airline-auth-service
  mail:
    from: ${MAIL_FROM:noreply@airline.local}
  reminder:
    lead-hours: ${REMINDER_LEAD_HOURS:24}      # departure reminder is sent this long before departure
    max-attempts: 5                            # sending attempts before a notification is marked FAILED
    retry-backoff-minutes: 5                   # wait attempt x 5 minutes between attempts
  dispatch:
    interval-ms: ${DISPATCH_INTERVAL_MS:10000} # how often due notifications are sent

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      enabled: false     # an unreachable SMTP server must not mark the whole service DOWN

# Registers as REMINDER-SERVICE. Set EUREKA_ENABLED=false to run this service completely on its own.
eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

logging:
  level:
    com.airline: INFO
